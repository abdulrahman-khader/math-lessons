# يبني كل الدروس عند كل دفع إلى main، ويختبر ما تغيّر منذ آخر نشر (scripts/test.mjs)، وينشر على GitHub Pages إذا نجح.
# الاختبار الكامل لكل الدروس يُشغَّل على الجهاز قبل الرفع حين يتغيّر المحرك: npm run test:all
name: Publish lessons

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # لمعرفة ما تغيّر منذ آخر نشر
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # الاختبارات تستعمل Google Chrome المثبّت مسبقًا على مشغّلات GitHub
      - run: node scripts/test.mjs --no-build
        env:
          TEST_BASE: ${{ github.event.before }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
